# Automated build and quality checks for Wonder
name: Wonder Build Checks

# Workflow is triggered on
on:
  push:
  pull_request:
  workflow_dispatch:

# Github Actions can read the contents of the repository
permissions:
  contents: read

jobs:

  # Frontend validation
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    # Execute commands from the frontend directory
    defaults:
      run:
        working-directory: frontend

    steps:
      # Retrieve the repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure Node.js and cache npm dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Static code analysis
      - name: Run ESLint
        run: npm run lint

      # Execute automated tests
      - name: Run tests
        run: npm test

      # Check TypeScript and build the frontend
      - name: Build frontend
        run: npm run build

  # Backend validation
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    # Execute commands from the backend directory
    defaults:
      run:
        working-directory: backend

    steps:
      # Retrieve the repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure Node.js and cache npm dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Install dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Static code analysis
      - name: Run ESLint
        run: npm run lint

      # TypeScript type checking
      - name: Check TypeScript
        run: npm run typecheck

      # Execute automated tests
      - name: Run tests
        run: npm test

      # Compile TypeScript into JavaScript
      - name: Build backend
        run: npm run build

  # SonarQube Cloud code quality analysis
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    # Analyze the main branch and pull requests
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      # Retrieve the complete Git history
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Analyze code and send results to SonarQube Cloud
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
