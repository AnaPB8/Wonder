# SonarQube Cloud project identification
sonar.organization=anapb8
sonar.projectKey=AnaPB8_Wonder
sonar.projectName=Wonder

# Source code directories
sonar.sources=frontend/src,backend/src

# Test directories
sonar.tests=frontend/src/tests,backend/src/tests

# Include only test files in the test scope
sonar.test.inclusions=frontend/src/tests/**,backend/src/tests/**

# Exclude tests and generated code from source analysis
sonar.exclusions=frontend/src/tests/**,backend/src/tests/**,**/generated/**

# Source file encoding
sonar.sourceEncoding=UTF-8

# Import frontend and backend test coverage reports
sonar.javascript.lcov.reportPaths=coverage-reports/frontend-coverage/lcov.info,coverage-reports/backend-coverage/lcov.info

# Exclude application entry points and utility scripts from coverage calculations
sonar.coverage.exclusions=frontend/src/main.tsx,backend/src/server.ts,backend/src/scripts/**,**/generated/**
